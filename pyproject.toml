[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobs-scraper"
version = "1.1.1"
description = "Multi-source product-management job scraper with LinkedIn/Jora/JobStreet integrations, a local MCP server + Agent Skill, and portable Region-Raw/Region-Selected Google Sheet Job Tracker onboarding."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "danielcanfly" }]
keywords = ["jobs", "scraper", "linkedin", "jora", "jobstreet", "product-manager", "mcp", "google-sheets"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "curl-cffi>=0.5.10",
    "scrapling>=0.4.14,<0.5",
    "gspread>=6.0.0",
    "google-auth>=2.23.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
    "mcp>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "mypy>=2.3.1",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/danielcanfly/jobs-scraper"
Repository = "https://github.com/danielcanfly/jobs-scraper"

# Canonical dependency source. requirements.txt mirrors this dependency set.
# v1.2 keeps legacy top-level compatibility modules while implementation moves
# behind an installable jobs_scraper package.
[tool.setuptools]
py-modules = [
    "sg_product_jobs",
    "server",
    "server_v1_1",
    "job_tracker",
    "runtime_core",
    "region_policy",
]
packages = ["jobs_scraper", "jobs_scraper.sources", "jobs_scraper.tracker", "jobs_scraper.mcp_services"]

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["runtime_core.py", "region_policy.py", "job_tracker.py"]
ignore_missing_imports = true
warn_unused_configs = true
show_error_codes = true

[tool.coverage.run]
source = [
    "jobs_scraper",
    "server",
    "server_v1_1",
    "job_tracker",
    "runtime_core",
    "region_policy",
    "sg_product_jobs",
]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 0
