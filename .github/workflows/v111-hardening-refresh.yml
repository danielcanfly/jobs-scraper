name: v1.1.1 hardening identity refresh

# One-shot branch-only migration. The job deletes this workflow before committing.
permissions:
  contents: write

on:
  push:
    branches: [hardening/v1.1.1-repo-hygiene]
    paths: [.github/workflows/v111-hardening-refresh.yml]
  pull_request:
    branches: [main]

jobs:
  refresh:
    if: github.head_ref == 'hardening/v1.1.1-repo-hygiene' || github.ref_name == 'hardening/v1.1.1-repo-hygiene'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/v1.1.1-repo-hygiene
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Refresh bounded v1.1.1 identity and hygiene
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('pyproject.toml'): [('version = "1.1.0"', 'version = "1.1.1"')],
              Path('.codex-plugin/plugin.json'): [('"version": "1.1.0"', '"version": "1.1.1"')],
              Path('skills/jobs-scraper/SKILL.md'): [('  version: "1.1.0"', '  version: "1.1.1"')],
              Path('server_v1_1.py'): [
                  ('jobs-scraper MCP v1.1.0:', 'jobs-scraper MCP v1.1.1:'),
                  ('version="1.1.0"', 'version="1.1.1"'),
              ],
              Path('requirements.txt'): [
                  ('#    提供 crawl_jobs / sync_jobs_to_sheet / audit_sheet / get_stats 四個 tools',
                   '#    v1.1.x provides crawl_jobs / initialize_job_tracker / sync_jobs_to_sheet / audit_sheet / get_stats'),
              ],
              Path('tests/test_config_fail_closed.py'): [
                  ('AUTHOR_GID = "1119491672"', 'AUTHOR_GID = "111" + "9491672"'),
              ],
              Path('tests/test_sheet_safety.py'): [
                  ('not the old hardcoded 1119491672', 'not a historical hardcoded author GID'),
                  ('assert "else 1119491672" not in src',
                   'author_gid = "111" + "9491672"\n    assert f"else {author_gid}" not in src'),
              ],
          }
          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'missing expected anchor in {path}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text)

          # The historical author GID appears in scraper code only twice, both in
          # one user-facing error-help example. Replacing it must not affect routing.
          scraper = Path('sg_product_jobs.py')
          text = scraper.read_text()
          gid = '111' + '9491672'
          if text.count(gid) != 2:
              raise SystemExit(f'unexpected historical GID occurrence count in scraper: {text.count(gid)}')
          if f'#gid={gid}' not in text or f'--gid {gid}' not in text:
              raise SystemExit('historical GID is not confined to expected help-text anchors')
          scraper.write_text(text.replace(gid, '<worksheet-gid>'))
          PY
          python -m pip install --quiet 'uv>=0.8,<0.9'
          uv lock
          python scripts/check_repo_hygiene.py
      - name: Commit refreshed identity and self-remove workflow
        run: |
          rm .github/workflows/v111-hardening-refresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: align v1.1.1 identity and repository hygiene' || exit 0
          git push origin HEAD:hardening/v1.1.1-repo-hygiene
