name: v11-atomic-repair

permissions:
  contents: write

on:
  push:
    branches: [feature/job-tracker-v1.1.0]
    paths:
      - scripts/_v11_atomic_repair.py
      - .ci/v11-atomic-trigger

jobs:
  repair:
    if: github.actor == 'danielcanfly'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/job-tracker-v1.1.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact-anchor bounded repair
        run: python scripts/_v11_atomic_repair.py
      - name: Sanity compile patched files
        run: python -m py_compile job_tracker.py tests/test_job_tracker_hostile_v11.py
      - name: Commit product patch and self-clean repair scaffolding
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add job_tracker.py tests/test_job_tracker_hostile_v11.py
          git rm scripts/_v11_atomic_repair.py .github/workflows/v11-atomic-repair.yml .ci/v11-atomic-trigger
          git commit -m 'fix: make v1.1 tracker initialization atomic'
          git push origin HEAD:feature/job-tracker-v1.1.0
