name: ci

permissions:
  contents: read

on:
  push:
    branches: [main, repair/**, feature/**, hardening/**]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SHEET_ID: ""
      SHEET_GID: ""
      GSPREAD_SA_KEY_PATH: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lock tooling
        run: python -m pip install --quiet 'uv>=0.8,<0.9'

      - name: Verify reproducible lock
        run: |
          test -f uv.lock
          uv lock --check

      - name: Install locked environment
        run: uv sync --locked --extra dev --python 3.11

      - name: Compile all
        run: .venv/bin/python -m compileall -q .

      - name: Run Ruff lint/import hygiene
        run: .venv/bin/python -m ruff check .

      - name: Run Ruff format check
        run: |
          FORMAT_TARGETS="$(git ls-files '*.py' ':!tests/equivalence/*' ':!scripts/check_equivalence_freeze.py')"
          .venv/bin/python -m ruff format --check $FORMAT_TARGETS

      - name: Run typing scaffold
        run: .venv/bin/python -m mypy --config-file pyproject.toml

      - name: Run coverage report
        run: .venv/bin/python -m pytest --cov=jobs_scraper --cov=server --cov=server_v1_1 --cov=job_tracker --cov=runtime_core --cov=region_policy --cov=sg_product_jobs --cov-report=term-missing --cov-fail-under=0

      - name: Run helper regressions explicitly
        run: .venv/bin/python test_helpers.py

      - name: Verify behaviour equivalence harness freeze
        run: .venv/bin/python scripts/check_equivalence_freeze.py

      - name: Run behaviour equivalence gate
        run: .venv/bin/python -m pytest -q tests/equivalence/test_v130_equivalence.py

      - name: Run full pytest suite
        run: .venv/bin/python -m pytest -q

      - name: Run doctor
        run: .venv/bin/python scripts/doctor.py

      - name: Validate Agent Skill with authoritative skills-ref
        run: |
          uv pip install --python .venv/bin/python 'skills-ref @ git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref'
          .venv/bin/skills-ref validate skills/jobs-scraper

      - name: Validate .codex-plugin manifest
        run: |
          test -f .codex-plugin/plugin.json
          .venv/bin/python -c "
          import json, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          m = json.load(open('.codex-plugin/plugin.json'))
          assert m['name'] == 'jobs-scraper', m['name']
          assert m['version'] == version, (m['version'], version)
          assert m['skills'] == './skills/'
          print(f'.codex-plugin manifest OK (version {version})')
          "

      - name: Verify legacy v1.0 MCP stdio transport
        run: .venv/bin/python scripts/verify_mcp_stdio.py

      - name: Verify v1.1 tracker MCP stdio transport
        run: .venv/bin/python scripts/verify_mcp_stdio_v11.py

      - name: Fresh-install legacy verification
        run: .venv/bin/python scripts/verify_fresh_install.py

      - name: Fresh-install v1.1 tracker verification
        run: .venv/bin/python scripts/verify_fresh_install_v11.py

      - name: Repository-wide production metadata and secret hygiene
        run: .venv/bin/python scripts/check_repo_hygiene.py

      - name: Verify the plugin sync manifest covers every tracked file
        run: .venv/bin/python scripts/check_sync_manifest.py

      - name: Verify the version line agrees with itself
        run: .venv/bin/python ops/check_version_line.py

  release:
    # A pushed tag becomes a GitHub Release.
    #
    # The tag itself is created by ops/release.sh, locally, after every guard
    # has passed: whether a change is a release is a person's decision, not the
    # pipeline's. This job only turns a tag that was already decided into a
    # Release object — and it needs no credential of its own, because
    # GITHUB_TOKEN is minted by GitHub for this run.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create the GitHub Release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="$(awk -v want="## ${tag} " '
            index($0, want) == 1 { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md)"
          if [ -z "$notes" ]; then
            notes="Release ${tag}."
          fi
          # Idempotent: a tag that already has a release gets its notes
          # refreshed instead of failing the run.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" --notes "$notes"
            echo "updated the release for $tag"
          else
            gh release create "$tag" --title "$tag" --notes "$notes"
            echo "created the release for $tag"
          fi
