name: ci

permissions:
  contents: write

on:
  push:
    branches: [main, repair/**, feature/**, hardening/**]
  pull_request:
    branches: [main]

jobs:
  migrate_b3a_linkedin:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/v1.2.0-architecture-cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.2.0-architecture-cleanup
          fetch-depth: 2

      - name: Apply bounded LinkedIn adapter migration
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('sg_product_jobs.py')
          text = path.read_text(encoding='utf-8')
          import_anchor = 'from bs4 import BeautifulSoup\n'
          import_line = 'from jobs_scraper.sources import linkedin as linkedin_source\n'
          if import_line in text:
              print('B3A_ALREADY_MIGRATED')
              raise SystemExit(0)
          if import_anchor not in text:
              raise SystemExit('IMPORT_ANCHOR_MISSING')
          text = text.replace(import_anchor, import_anchor + import_line, 1)
          start_marker = '# ─────────────────────────────────────────────────────────────\n# 列表頁\n# ─────────────────────────────────────────────────────────────\n'
          end_marker = '# ─────────────────────────────────────────────────────────────\n# 主程式\n# ─────────────────────────────────────────────────────────────\n'
          start = text.find(start_marker)
          end = text.find(end_marker, start + 1)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('LINKEDIN_BLOCK_MARKERS_MISSING')
          replacement_lines = [
              '# ─────────────────────────────────────────────────────────────',
              '# LinkedIn compatibility surface',
              '# Implementation owner: jobs_scraper.sources.linkedin',
              '# ─────────────────────────────────────────────────────────────',
              'JOB_CARD_SEL = linkedin_source.JOB_CARD_SEL',
              'TITLE_SEL = linkedin_source.TITLE_SEL',
              'COMPANY_SEL = linkedin_source.COMPANY_SEL',
              'LOC_SEL = linkedin_source.LOC_SEL',
              'TIME_SEL = linkedin_source.TIME_SEL',
              'LINK_SEL = linkedin_source.LINK_SEL',
              'JD_DESC_SEL = linkedin_source.JD_DESC_SEL',
              'JD_BLOCK_SEL = linkedin_source.JD_BLOCK_SEL',
              '_clean = linkedin_source._clean',
              '', '',
              'def build_list_url(tpr: str, start: int, location: str = LOCATION, geo_id: str = GEO_ID) -> str:',
              '    return linkedin_source.build_list_url(',
              '        tpr, start, location, geo_id, keywords=KEYWORDS,',
              '    )',
              '', '',
              'def parse_list_page(html: str) -> list[dict]:',
              '    return linkedin_source.parse_list_page(html)',
              '', '',
              'def fetch_list_page(tpr: str, start: int, location: str = LOCATION, geo_id: str = GEO_ID) -> str:',
              '    return linkedin_source.fetch_list_page(',
              '        _cc_session, tpr, start, location, geo_id, keywords=KEYWORDS,',
              '    )',
              '', '',
              'def build_jd_url(job_id: str) -> str:',
              '    return linkedin_source.build_jd_url(job_id)',
              '', '',
              'def fetch_jd(job_id: str) -> dict:',
              '    return linkedin_source.fetch_jd(_cc_session, job_id)',
              '', '',
          ]
          replacement = '\n'.join(replacement_lines)
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
          if git diff --quiet -- sg_product_jobs.py; then
            echo 'B3A_NO_SOURCE_DIFF'
            exit 0
          fi
          python -m py_compile sg_product_jobs.py
          git diff --check -- sg_product_jobs.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sg_product_jobs.py
          git commit -m 'refactor: route LinkedIn through source adapter'
          git push origin HEAD:feature/v1.2.0-architecture-cleanup

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SHEET_ID: ""
      SHEET_GID: ""
      GSPREAD_SA_KEY_PATH: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lock tooling
        run: python -m pip install --quiet 'uv>=0.8,<0.9'

      - name: Verify reproducible lock
        run: |
          test -f uv.lock
          uv lock --check

      - name: Install locked environment
        run: uv sync --locked --extra dev --python 3.11

      - name: Compile all
        run: .venv/bin/python -m compileall -q .

      - name: Run original 27 helper regressions explicitly
        run: .venv/bin/python test_helpers.py

      - name: Verify behaviour equivalence harness freeze
        run: .venv/bin/python scripts/check_equivalence_freeze.py

      - name: Run v1.1.1 behaviour equivalence gate
        run: .venv/bin/python -m pytest -q tests/equivalence/test_v111_equivalence.py

      - name: Run full pytest suite
        run: .venv/bin/python -m pytest -q

      - name: Run doctor
        run: .venv/bin/python scripts/doctor.py

      - name: Validate Agent Skill with authoritative skills-ref
        run: |
          uv pip install --python .venv/bin/python 'skills-ref @ git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref'
          .venv/bin/skills-ref validate skills/jobs-scraper

      - name: Validate .codex-plugin manifest
        run: |
          test -f .codex-plugin/plugin.json
          .venv/bin/python -c "import json; m=json.load(open('.codex-plugin/plugin.json')); assert m['name']=='jobs-scraper'; assert m['version']=='1.1.1'; assert m['skills']=='./skills/'"

      - name: Verify legacy v1.0 MCP stdio transport
        run: .venv/bin/python scripts/verify_mcp_stdio.py

      - name: Verify v1.1 tracker MCP stdio transport
        run: .venv/bin/python scripts/verify_mcp_stdio_v11.py

      - name: Fresh-install legacy verification
        run: .venv/bin/python scripts/verify_fresh_install.py

      - name: Fresh-install v1.1 tracker verification
        run: .venv/bin/python scripts/verify_fresh_install_v11.py

      - name: Repository-wide production metadata and secret hygiene
        run: .venv/bin/python scripts/check_repo_hygiene.py
