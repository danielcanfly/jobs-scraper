name: ci

permissions:
  contents: write

on:
  push:
    branches: [main, repair/**]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SHEET_ID: ""
      SHEET_GID: ""
      GSPREAD_SA_KEY_PATH: ""

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply bounded primary correction
        if: github.event_name == 'push' && github.ref == 'refs/heads/repair/audit-v1.0.0'
        run: |
          if [ -f scripts/apply_primary_correction.py ]; then
            python scripts/apply_primary_correction.py
          fi

      - name: Install lock tooling
        run: python -m pip install --quiet 'uv>=0.8,<0.9'

      - name: Generate lock on repair branch and commit bounded corrections
        if: github.event_name == 'push' && github.ref == 'refs/heads/repair/audit-v1.0.0'
        run: |
          uv lock
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name 'jobs-scraper primary repair'
            git config user.email 'primary-repair@jobs-scraper.local'
            git commit -m 'Primary correction: behavioral MCP tests, safety closure, reproducible lock'
            git push origin HEAD:repair/audit-v1.0.0
          fi

      - name: Verify lock is current
        run: |
          test -f uv.lock
          uv lock --check

      - name: Install package + dev deps
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --quiet --upgrade pip
          .venv/bin/python -m pip install --quiet -e ".[dev]"

      - name: Compile all
        run: .venv/bin/python -m compileall -q .

      - name: Run original helper regression explicitly
        run: .venv/bin/python test_helpers.py

      - name: Run full pytest suite
        run: .venv/bin/python -m pytest -q

      - name: Run doctor
        run: .venv/bin/python scripts/doctor.py

      - name: Validate Agent Skill with authoritative skills-ref
        run: |
          .venv/bin/python -m pip install --quiet 'skills-ref @ git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref'
          .venv/bin/skills-ref validate skills/jobs-scraper

      - name: Validate .codex-plugin manifest
        run: |
          test -f .codex-plugin/plugin.json
          .venv/bin/python -c "import json; m=json.load(open('.codex-plugin/plugin.json')); assert m['name']=='jobs-scraper'; assert m['version']=='1.0.0'; assert m['skills']=='./skills/'"

      - name: Verify MCP stdio transport
        run: .venv/bin/python scripts/verify_mcp_stdio.py

      - name: Fresh-install verification
        run: .venv/bin/python scripts/verify_fresh_install.py

      - name: Author production Sheet ID must not appear in distributable surfaces
        run: |
          ! git grep -n '1e-YlVFo0pn2QOXP4xsKJDZdnlJQR1eREwy-Fc42jAZ8' -- 'sg_product_jobs.py' 'server.py' 'setup.sh' '.codex-plugin/' 'skills/' 'scripts/' 'tests/' 'pyproject.toml' '.env.example' 'README.md' || (echo 'FAIL: author Sheet ID leaked into distributable/test surfaces'; exit 1)
