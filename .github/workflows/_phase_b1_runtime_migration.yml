name: phase-b1-runtime-migration

on:
  push:
    branches: [feature/v1.2.0-architecture-cleanup]
    paths: [.github/workflows/_phase_b1_runtime_migration.yml]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.2.0-architecture-cleanup
          fetch-depth: 0

      - name: Apply bounded runtime extraction
        run: |
          python - <<'PY'
          from pathlib import Path

          # server.py: preserve private names as compatibility aliases, move implementation to runtime_core.
          p = Path('server.py')
          text = p.read_text(encoding='utf-8')
          anchor = 'import sg_product_jobs as M  # noqa: E402\n'
          assert text.count(anchor) == 1
          assert 'import runtime_core as RT' not in text
          text = text.replace(anchor, anchor + 'import runtime_core as RT\n', 1)

          start = text.index('REPO_ROOT = Path(__file__).parent.resolve()')
          end = text.index('SCOPES_READONLY =', start)
          text = text[:start] + '''REPO_ROOT = RT.REPO_ROOT
          PYTHON_EXE = RT.PYTHON_EXE
          SUBPROCESS_TIMEOUT = RT.SUBPROCESS_TIMEOUT
          OUTPUT_TAIL_STDOUT = RT.OUTPUT_TAIL_STDOUT
          OUTPUT_TAIL_STDERR = RT.OUTPUT_TAIL_STDERR

          Source = RT.Source
          Range = RT.Range

          ''' + text[end:]

          start = text.index('def _run_subprocess(')
          marker = '# ──────────────────────────────────────────────────────────────────────\n# 1. crawl_jobs'
          end = text.index(marker, start)
          text = text[:start] + '''# Backward-compatible aliases for v1.0 callers/tests. Runtime implementation is shared.
          _run_subprocess = RT.run_scraper_subprocess
          SUMMARY_PREFIX = RT.SUMMARY_PREFIX
          _parse_machine_summary = RT.parse_machine_summary


          ''' + text[end:]
          p.write_text(text, encoding='utf-8')

          # server_v1_1.py: stop depending on legacy private helpers/config paths/types.
          p = Path('server_v1_1.py')
          text = p.read_text(encoding='utf-8')
          anchor = 'import job_tracker as JT\nimport server as legacy\nimport sg_product_jobs as M\n'
          assert text.count(anchor) == 1
          text = text.replace(anchor, 'import job_tracker as JT\nimport runtime_core as RT\nimport server as legacy\nimport sg_product_jobs as M\n', 1)
          replacements = {
              'Source = legacy.Source': 'Source = RT.Source',
              'Range = legacy.Range': 'Range = RT.Range',
              'JT.check_tracker_config(legacy.REPO_ROOT)': 'JT.check_tracker_config(RT.REPO_ROOT)',
              'legacy._run_subprocess(args)': 'RT.run_scraper_subprocess(args)',
              'legacy._parse_machine_summary(r["stdout_tail"])': 'RT.parse_machine_summary(r["stdout_tail"])',
              'legacy.REPO_ROOT / "seen_jds.jsonl"': 'RT.REPO_ROOT / "seen_jds.jsonl"',
          }
          for old, new in replacements.items():
              assert old in text, old
              text = text.replace(old, new)
          assert 'legacy._run_subprocess' not in text
          assert 'legacy._parse_machine_summary' not in text
          assert 'legacy.REPO_ROOT' not in text
          assert 'legacy.Source' not in text
          assert 'legacy.Range' not in text
          p.write_text(text, encoding='utf-8')

          # Move implementation-structure test to the new shared owner.
          p = Path('tests/test_mcp_contract.py')
          text = p.read_text(encoding='utf-8')
          start = text.index('def test_subprocess_uses_sys_executable_and_cwd():')
          end = text.index('# ── Q30:', start)
          replacement = '''def test_subprocess_uses_sys_executable_and_cwd():
              import inspect
              import runtime_core as RT
              import server

              src = inspect.getsource(RT)
              assert "subprocess.run" in src
              assert "shell=True" not in src
              assert "sys.executable" in src
              assert "REPO_ROOT" in src
              assert server._run_subprocess is RT.run_scraper_subprocess
              assert server._parse_machine_summary is RT.parse_machine_summary


          '''
          text = text[:start] + replacement + text[end:]
          p.write_text(text, encoding='utf-8')

          # Hostile v1.1 tests should patch the shared runtime owner, not legacy private names.
          p = Path('tests/test_job_tracker_hostile_v11.py')
          text = p.read_text(encoding='utf-8')
          old = 'monkeypatch.setattr(S.legacy, "_run_subprocess",'
          assert text.count(old) == 5, text.count(old)
          text = text.replace(old, 'monkeypatch.setattr(S.RT, "run_scraper_subprocess",')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Assert migration scope
        run: |
          python -m compileall -q runtime_core.py server.py server_v1_1.py tests
          ! grep -nE 'legacy\._run_subprocess|legacy\._parse_machine_summary|legacy\.REPO_ROOT|legacy\.Source|legacy\.Range' server_v1_1.py
          git diff --check

      - name: Commit migration and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_phase_b1_runtime_migration.yml
          git add server.py server_v1_1.py tests/test_mcp_contract.py tests/test_job_tracker_hostile_v11.py runtime_core.py
          git commit -m 'refactor: share MCP runtime execution helpers'
          git push origin HEAD:feature/v1.2.0-architecture-cleanup
