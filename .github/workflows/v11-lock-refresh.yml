name: v11-lock-refresh

permissions:
  contents: write

on:
  push:
    branches: [feature/job-tracker-v1.1.0]
    paths: [pyproject.toml]

jobs:
  refresh-lock:
    if: github.actor == 'danielcanfly'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/job-tracker-v1.1.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet 'uv>=0.8,<0.9'
      - name: Regenerate lock from pyproject
        run: uv lock
      - name: Commit lock only if changed
        run: |
          if git diff --quiet -- uv.lock; then
            echo 'LOCK_ALREADY_CURRENT'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uv.lock
          git commit -m 'chore: regenerate uv.lock for v1.1.0'
          git push origin HEAD:feature/job-tracker-v1.1.0
