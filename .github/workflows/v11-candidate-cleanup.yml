name: v11-candidate-cleanup

permissions:
  contents: write

on:
  push:
    branches: [feature/job-tracker-v1.1.0]
    paths:
      - .ci/v11-candidate-cleanup-trigger

jobs:
  cleanup:
    if: github.actor == 'danielcanfly'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/job-tracker-v1.1.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact-anchor docs cleanup
        run: python scripts/_v11_candidate_cleanup.py
      - name: Sanity-check docs anchors
        run: |
          grep -F 'one Google Sheets `batchUpdate` transaction' README.md
          grep -F 'exact A:AA header write-compatibility contract' README.md
          grep -F 'verify_fresh_install_v11.py' README.md
      - name: Commit clean candidate tree and remove all temporary probe scaffolding
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md skills/jobs-scraper/SKILL.md skills/jobs-scraper/references/JOB_TRACKER_SCHEMA.md skills/jobs-scraper/references/OPERATIONS.md
          git rm scripts/_v11_candidate_cleanup.py .github/workflows/v11-candidate-cleanup.yml .ci/v11-candidate-cleanup-trigger
          git rm -f .github/workflows/v11-ci-probe.yml .ci/v11-probe-trigger .ci/V11_PROBE_RESULT.md
          git commit -m 'docs: seal v1.1 onboarding and remove probe scaffolding'
          git push origin HEAD:feature/job-tracker-v1.1.0
